<!DOCTYPE html>
<html>
<head>
  <title>Messages</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h2>Messages</h2>
  <div id="chatBox" class="border p-3 mb-3" style="height:200px; overflow-y:scroll;"></div>
  <input type="text" id="msg" class="form-control mb-2" placeholder="Type message">
  <button id="sendBtn" class="btn btn-primary">Send</button>

  <script>
    document.getElementById("sendBtn").addEventListener("click", function(){
      fetch("http://localhost:8080/api/messages", {
        method: "POST",
        headers: {
          "Authorization": localStorage.getItem("jwtToken"),
          "Content-Type":"application/json"
        },
        body: JSON.stringify({ text: document.getElementById("msg").value })
      }).then(() => {
        document.getElementById("chatBox").innerHTML += "<div>"+document.getElementById("msg").value+"</div>";
        document.getElementById("msg").value = "";
      });
    });
  </script>
</body>
</html>
