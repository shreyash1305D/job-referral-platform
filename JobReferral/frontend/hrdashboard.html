<!DOCTYPE html>
<html>
<head>
  <title>HR Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h2>HR Referral Requests</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Referral ID</th>
        <th>Job Title</th>
        <th>Candidate</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="referralTable"></tbody>
  </table>

  <script>
    // Fetch referral requests for HR
    fetch("http://localhost:8080/api/referrals/pending", {
      headers: { "Authorization": localStorage.getItem("jwtToken") }
    })
    .then(res => res.json())
    .then(data => {
      let table = document.getElementById("referralTable");
      data.forEach(ref => {
        let row = document.createElement("tr");
        row.innerHTML = `
          <td>${ref.id}</td>
          <td>${ref.jobTitle}</td>
          <td>${ref.candidateName}</td>
          <td>${ref.status}</td>
          <td>
            <button class="btn btn-success btn-sm" onclick="updateReferral(${ref.id}, 'Accepted')">Accept</button>
            <button class="btn btn-danger btn-sm" onclick="updateReferral(${ref.id}, 'Rejected')">Reject</button>
          </td>
        `;
        table.appendChild(row);
      });
    });

    // Update referral status
    function updateReferral(referralId, status) {
      fetch(`http://localhost:8080/api/referrals/${referralId}`, {
        method: "PUT",
        headers: {
          "Authorization": localStorage.getItem("jwtToken"),
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status: status })
      })
      .then(res => {
        if(res.ok) {
          alert("Referral " + status);
          location.reload(); // refresh table
        } else {
          alert("Error updating referral");
        }
      });
    }
  </script>
</body>
</html>
