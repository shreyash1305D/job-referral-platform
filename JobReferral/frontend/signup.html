<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
  <h2>Signup</h2>
  <form id="signupForm">
    <input type="text" class="form-control mb-2" placeholder="Name" id="name">
    <input type="email" class="form-control mb-2" placeholder="Email" id="email">
    <input type="password" class="form-control mb-2" placeholder="Password" id="password">
    <select class="form-control mb-2" id="role">
      <option value="candidate">Candidate</option>
      <option value="employee">Employee</option>
      <option value="hr">HR</option>
      <option value="admin">Admin</option>
    </select>
    <textarea class="form-control mb-2" placeholder="Skills" id="skills"></textarea>
    <input type="text" class="form-control mb-2" placeholder="Resume URL" id="resume_url">
    <button type="submit" class="btn btn-primary">Signup</button>
  </form>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e){
      e.preventDefault();
      fetch("http://localhost:8080/api/users/signup", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          role: document.getElementById("role").value,
          skills: document.getElementById("skills").value,
          resume_url: document.getElementById("resume_url").value
        })
      })
      .then(res => {
        if(res.ok){
          alert("Signup successful! Please login now.");
          window.location.href = "login.html";
        } else {
          alert("Signup failed!");
        }
      });
    });
  </script>
</body>
</html>
